<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Rutina Integral Guadalupe Ruiz</title>
<meta name="theme-color" content="#faf6f0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rutina Guada">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#faf6f0;
  --card:#ffffff;
  --card2:#f6f0e7;
  --card3:#ece4d8;
  --rose:#d4778a;
  --rose2:#e8a0b0;
  --rose-dim:rgba(212,119,138,0.11);
  --sage:#7f9c7b;
  --sage2:#9db899;
  --sage-dim:rgba(127,156,123,0.13);
  --ochre:#d6a552;
  --ochre-dim:rgba(214,165,82,0.14);
  --green:#4f9d73;
  --green-dim:rgba(79,157,115,0.13);
  --text:#33291f;
  --muted:#9a8c7e;
  --muted2:#c6b9aa;
  --border:rgba(120,85,60,0.12);
  --border2:rgba(120,85,60,0.20);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;overflow-x:hidden}

/* Iconos SVG propios — mismo trazo que el logo, sin emojis */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ex-chk .ic,.p-chk .ic{width:12px;height:12px;stroke-width:2.4}
.s-badge .ic,.ph-pill .ic,.res-act-ok .ic,.stat-nm .ic{width:11px;height:11px;stroke-width:2.2}
.today-box-lbl .ic{width:12px;height:12px;stroke-width:2}
.chevron .ic,.p-chev .ic,.res-day-chev .ic{width:11px;height:11px;stroke-width:2.2}
.dbtn .ic,.tbtn .ic{width:13px;height:13px;stroke-width:2}
.rest-emoji .ic{width:46px;height:46px;stroke-width:1.2;color:var(--muted2)}
.week-nav-btn .ic,.week-strip-btn .ic{width:14px;height:14px;stroke-width:2.2}

/* HEADER */
.header{padding:14px 16px 0;position:sticky;top:0;background:rgba(250,246,240,0.96);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);z-index:100;border-bottom:1px solid var(--border)}
.header-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px;gap:10px}
.app-id{display:flex;align-items:center;gap:10px;min-width:0}
.app-logo{width:36px;height:36px;border-radius:10px;flex-shrink:0;object-fit:cover;border:1px solid var(--border)}
.app-title{display:flex;flex-direction:column;gap:1px;min-width:0}
.app-title-main{font-family:'Barlow Condensed',sans-serif;font-size:15px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;background:linear-gradient(90deg,var(--rose),var(--rose2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.app-title-sub{font-size:9px;font-weight:500;color:var(--muted);letter-spacing:2.2px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.today-date{font-size:11px;color:var(--muted);font-weight:500;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:4px 11px;flex-shrink:0}

.day-strip{display:flex;gap:5px;overflow-x:auto;padding:0 0 13px;scrollbar-width:none}
.day-strip::-webkit-scrollbar{display:none}
.day-btn{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 10px;border-radius:11px;border:1px solid var(--border);background:var(--card);cursor:pointer;transition:all 0.2s;min-width:46px}
.day-btn.active{background:linear-gradient(160deg,rgba(212,119,138,0.14),rgba(212,119,138,0.04));border-color:rgba(212,119,138,0.45);box-shadow:0 0 16px rgba(212,119,138,0.10)}
.day-btn .dn{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:0.8px;color:var(--muted)}
.day-btn.active .dn{color:var(--rose)}
.day-btn .dd{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:700;color:var(--text);line-height:1}
.day-btn.active .dd{color:var(--rose)}
.day-dot{width:4px;height:4px;border-radius:50%;background:var(--muted2);margin-top:1px;transition:all 0.2s}
.day-btn.has-dot .day-dot{background:var(--rose);opacity:0.55}
.day-btn.active .day-dot{opacity:0}
.day-btn.full-done .day-dot{background:var(--green);opacity:1}
.day-btn.today-mark .dn{color:var(--sage)}

.week-strip-nav{display:flex;align-items:center;justify-content:space-between;padding:6px 0 8px;gap:8px}
.week-strip-btn{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted);cursor:pointer;width:28px;height:28px;display:flex;align-items:center;justify-content:center;transition:all 0.2s;flex-shrink:0}
.week-strip-btn:hover{color:var(--rose);border-color:rgba(212,119,138,0.4)}
.week-strip-label{flex:1;text-align:center;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text);letter-spacing:0.5px}
.week-strip-label span{font-size:9px;font-weight:600;color:var(--rose);background:var(--rose-dim);border:1px solid rgba(212,119,138,0.25);border-radius:8px;padding:2px 7px;margin-left:7px;letter-spacing:1px;text-transform:uppercase;vertical-align:middle}

.content{padding:18px 16px 110px;position:relative}

/* DIA */
.day-hero{margin-bottom:16px}
.lbl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.day-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2.5px;color:var(--rose)}
.day-big{font-family:'Barlow Condensed',sans-serif;font-size:42px;font-weight:900;letter-spacing:1px;line-height:1;color:var(--text);margin-top:3px}
.day-sub{color:var(--muted);font-size:11px;margin-top:5px;font-weight:400}
.lbl-edit{background:none;border:none;padding:2px;cursor:pointer;color:var(--muted2);display:none;align-items:center;transition:color 0.15s}
.lbl-edit .ic{width:13px;height:13px}
.lbl-edit:hover{color:var(--rose)}
body.edit-on .lbl-edit{display:flex}

.mode-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.mode-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--border2);color:var(--muted);border-radius:20px;padding:6px 13px;font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;font-family:'DM Sans',sans-serif;cursor:pointer;transition:all 0.2s}
.mode-btn .ic{width:12px;height:12px;stroke-width:2}
.mode-btn.on{background:var(--rose-dim);border-color:rgba(212,119,138,0.4);color:var(--rose)}
.mode-hint{font-size:9px;color:var(--muted2);flex:1;text-align:right;line-height:1.4}

/* SESIONES */
.session-card{background:var(--card);border:1px solid var(--border);border-radius:13px;margin-bottom:10px;overflow:hidden;transition:border-color 0.25s;animation:fadeUp 0.25s ease both}
.session-card.open{border-color:var(--border2)}
.session-card.all-done{border-color:rgba(79,157,115,0.40)}
.sess-hdr{padding:13px 15px;display:flex;align-items:center;gap:12px;cursor:pointer;user-select:none}
.s-emoji{font-size:21px;line-height:1;display:inline-block}
.res-act-name .s-emoji{font-size:13px}
.s-ico{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:1px solid var(--border)}
.ic-gym{background:linear-gradient(135deg,rgba(212,119,138,0.16),rgba(212,119,138,0.04));color:var(--rose)}
.ic-run{background:linear-gradient(135deg,rgba(127,156,123,0.18),rgba(127,156,123,0.04));color:var(--sage)}
.ic-core{background:linear-gradient(135deg,rgba(214,165,82,0.18),rgba(214,165,82,0.04));color:var(--ochre)}
.ic-hiit{background:linear-gradient(135deg,rgba(212,119,138,0.20),rgba(214,165,82,0.10));color:var(--rose)}
.ic-yoga{background:linear-gradient(135deg,rgba(127,156,123,0.18),rgba(127,156,123,0.04));color:var(--sage)}
.ic-hockey{background:linear-gradient(135deg,rgba(214,165,82,0.18),rgba(127,156,123,0.08));color:var(--ochre)}
.s-inf{flex:1;min-width:0}
.s-type{font-size:9px;font-weight:600;color:var(--muted);margin-bottom:2px}
.s-name{font-family:'Barlow Condensed',sans-serif;font-size:17px;font-weight:700;color:var(--text);line-height:1.15}
.s-badge{font-size:10px;font-weight:700;color:var(--rose);background:var(--rose-dim);border:1px solid rgba(212,119,138,0.22);padding:4px 9px;border-radius:6px;white-space:nowrap;flex-shrink:0}
.s-badge.ok{color:var(--green);background:var(--green-dim);border-color:rgba(79,157,115,0.28)}
.chevron{color:var(--muted);transition:transform 0.3s;flex-shrink:0;display:flex}
.session-card.open .chevron{transform:rotate(180deg)}
.sess-body{max-height:0;overflow:hidden;transition:max-height 0.4s ease}
.session-card.open .sess-body{max-height:4000px}
.pbar-wrap{padding:10px 15px 8px;border-top:1px solid var(--border)}
.pbar-lbl{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-bottom:5px;font-weight:500}
.pbar{height:3px;background:var(--card3);border-radius:2px;overflow:hidden}
.pbar-fill{height:100%;background:linear-gradient(90deg,var(--rose),var(--rose2));border-radius:2px;transition:width 0.4s ease}
.pbar-fill.gfill{background:linear-gradient(90deg,var(--green),#79c39a)}

/* lápiz en la cabecera del bloque */
.sess-edit{width:28px;height:28px;display:none;align-items:center;justify-content:center;border-radius:7px;color:var(--muted2);cursor:pointer;flex-shrink:0;background:var(--card2);border:1px solid var(--border2);transition:all 0.15s}
.sess-edit .ic{width:14px;height:14px}
.sess-edit:hover{color:var(--rose);border-color:rgba(212,119,138,0.35)}
body.edit-on .sess-edit{display:flex}

/* herramientas de bloque (solo en modo edición) */
.sess-tools{display:none;gap:6px;padding:8px 15px 0;flex-wrap:wrap}
body.edit-on .sess-tools{display:flex}
.tool-btn{display:inline-flex;align-items:center;gap:5px;background:var(--card2);border:1px solid var(--border2);color:var(--muted);border-radius:7px;padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}
.tool-btn .ic{width:12px;height:12px;stroke-width:2}
.tool-btn:hover{color:var(--rose);border-color:rgba(212,119,138,0.35)}
.tool-btn.danger:hover{color:#c2607a;border-color:rgba(194,96,122,0.4)}

/* EJERCICIOS */
.ex-list{padding:4px 15px 14px}
.ex-item{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--border);transition:opacity 0.18s}
.ex-item:last-of-type{border-bottom:none}
.ex-item.done{opacity:0.38}
.ex-chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card2);transition:all 0.2s;cursor:pointer}
.ex-item.done .ex-chk{background:var(--rose);border-color:var(--rose);color:#fff}
.ex-det{flex:1;min-width:0;cursor:pointer}
.ex-nm{font-size:13px;font-weight:500;color:var(--text);margin-bottom:2px;line-height:1.35}
.ex-mt{font-size:10px;color:var(--muted)}
.ex-nt{font-size:10px;color:var(--muted);margin-top:2px;font-style:italic;line-height:1.45}
.ex-key{display:inline-block;font-size:8px;font-weight:800;letter-spacing:0.8px;text-transform:uppercase;color:var(--rose);background:var(--rose-dim);border:1px solid rgba(212,119,138,0.22);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:1px}
.ex-tag{font-size:8px;font-weight:700;padding:3px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:0.6px;flex-shrink:0;cursor:pointer}
.tag-fuerza{background:rgba(212,119,138,0.12);color:#c26a7d}
.tag-volumen{background:rgba(214,165,82,0.16);color:#b08430}
.tag-core{background:rgba(176,138,106,0.16);color:#9d7350}
.tag-postura{background:rgba(127,156,123,0.16);color:#6b8968}
.tag-correctivo{background:rgba(79,157,115,0.14);color:var(--green)}
.tag-atletico{background:rgba(194,121,158,0.14);color:#b2648c}
.tag-cardio{background:rgba(111,167,154,0.16);color:#5c9184}
.ex-tools{display:none;align-items:center;gap:2px;flex-shrink:0}
body.edit-on .ex-tools{display:flex}
body.edit-on .ex-tag{display:none}
.ex-btn{width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:var(--muted2);cursor:pointer;transition:color 0.15s,background 0.15s;background:none;border:none}
.ex-btn .ic{width:14px;height:14px}
.ex-btn:hover{color:var(--rose);background:var(--card2)}
.ex-btn:disabled{opacity:0.25;cursor:default}
.add-ex{display:none;width:100%;margin-top:10px;padding:11px;border-radius:9px;border:1px dashed var(--border2);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:11px;font-weight:600;cursor:pointer;align-items:center;justify-content:center;gap:6px;transition:all 0.2s}
.add-ex .ic{width:13px;height:13px}
.add-ex:hover{color:var(--rose);border-color:rgba(212,119,138,0.4)}
body.edit-on .add-ex{display:flex}
.add-block{display:none;width:100%;margin-top:4px;padding:13px;border-radius:11px;border:1px dashed var(--border2);background:transparent;color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;align-items:center;justify-content:center;gap:7px;transition:all 0.2s}
.add-block .ic{width:14px;height:14px}
.add-block:hover{color:var(--rose);border-color:rgba(212,119,138,0.4)}
body.edit-on .add-block{display:flex}

.rest-card{background:var(--card);border:1px solid var(--border);border-radius:13px;padding:50px 20px;text-align:center}
.rest-emoji{margin-bottom:14px;display:block}
.rest-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:2px;color:var(--muted);margin-bottom:8px}
.rest-txt{color:var(--muted);font-size:12px;line-height:1.7}

/* POSTURA */
.post-hero{background:linear-gradient(135deg,var(--card3),var(--card));border:1px solid rgba(127,156,123,0.22);border-radius:13px;padding:18px;margin-bottom:14px}
.post-badge{display:inline-flex;align-items:center;gap:7px;background:var(--sage-dim);border:1px solid rgba(127,156,123,0.3);border-radius:20px;padding:5px 13px;margin-bottom:12px}
.pb-dot{width:6px;height:6px;border-radius:50%;background:var(--sage)}
.pb-txt{font-size:10px;font-weight:700;color:var(--sage);letter-spacing:1px;text-transform:uppercase}
.post-title{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;letter-spacing:1px;margin-bottom:6px;color:var(--text)}
.post-desc{font-size:11px;color:var(--muted);line-height:1.65}
.phase-pills{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.ph-pill{padding:5px 13px;border-radius:20px;border:1px solid var(--border);font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--muted);background:var(--card)}
.ph-pill.done-ph{border-color:rgba(79,157,115,0.4);color:var(--green);background:var(--green-dim)}
.ph-block-title{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin:18px 0 8px;display:flex;align-items:center;gap:10px}
.ph-block-title::after{content:'';flex:1;height:1px;background:var(--border)}
.p-card{background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--border);overflow:hidden;animation:fadeUp 0.22s ease both;transition:border-color 0.2s,opacity 0.2s}
.p-card.p-done{border-color:rgba(79,157,115,0.3);opacity:0.6}
.p-hdr{padding:13px 14px;display:flex;align-items:center;gap:12px;user-select:none}
.p-hdr .p-chk,.p-hdr .p-inf,.p-hdr .p-chev{cursor:pointer}
.p-chk{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--border2);display:flex;align-items:center;justify-content:center;flex-shrink:0;background:var(--card2);transition:all 0.2s}
.p-card.p-done .p-chk{background:var(--green);border-color:var(--green);color:#fff}
.p-inf{flex:1;min-width:0}
.p-nm{font-size:13px;font-weight:500;margin-bottom:2px;color:var(--text)}
.p-pm{font-size:10px;color:var(--muted)}
.p-chev{color:var(--muted);transition:transform 0.3s;flex-shrink:0;display:flex}
.p-card.p-open .p-chev{transform:rotate(180deg)}
.p-body{max-height:0;overflow:hidden;transition:max-height 0.35s ease}
.p-card.p-open .p-body{max-height:800px}
.p-detail{padding:0 14px 14px;border-top:1px solid var(--border)}
.p-why{background:var(--sage-dim);border-left:3px solid var(--sage);border-radius:0 6px 6px 0;padding:9px 12px;font-size:10px;color:#5f7d5c;line-height:1.6;margin:12px 0 10px}
.p-why strong{color:var(--sage);font-weight:700}
.p-steps{list-style:none}
.p-steps li{display:flex;gap:10px;font-size:10px;line-height:1.6;padding:5px 0;border-bottom:1px solid var(--border);color:var(--text)}
.p-steps li:last-child{border-bottom:none}
.p-sn{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:700;color:var(--sage);flex-shrink:0;width:13px;margin-top:1px}
.p-btns{margin-top:12px;display:flex;gap:7px;flex-wrap:wrap}
.tbtn{display:inline-flex;align-items:center;gap:5px;background:var(--sage-dim);color:var(--sage);border:1px solid rgba(127,156,123,0.3);border-radius:7px;padding:6px 12px;font-size:10px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif}
.dbtn{display:inline-flex;align-items:center;gap:5px;background:var(--card2);color:var(--muted);border:1px solid var(--border2);border-radius:7px;padding:6px 12px;font-size:10px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all 0.2s}
.dbtn.is-done{background:var(--green-dim);color:var(--green);border-color:rgba(79,157,115,0.4)}

/* RESUMEN */
.res-header{margin-bottom:18px}
.res-title{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:900;letter-spacing:1.5px;margin-bottom:3px;color:var(--text)}
.res-sub{font-size:11px;color:var(--muted)}
.today-box{background:var(--card);border:1px solid rgba(212,119,138,0.22);border-radius:13px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden}
.today-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--rose),rgba(232,160,176,0.3))}
.today-box-lbl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--rose);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.today-row{display:flex;align-items:center;gap:18px}
.ring{width:82px;height:82px;position:relative;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6;stroke-linecap:round}
.ring .r-bg{stroke:var(--card3)}
.ring .r-fg{stroke:var(--rose);transition:stroke-dashoffset 0.6s ease,stroke 0.3s}
.ring.done .r-fg{stroke:var(--green)}
.ring-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Barlow Condensed',sans-serif;font-size:27px;font-weight:900;color:var(--rose);letter-spacing:-0.5px}
.ring.done .ring-txt{color:var(--green)}
.ring-txt span{font-size:14px;font-weight:700;margin-left:1px;opacity:0.65}
.today-stats{flex:1;min-width:0;display:flex;flex-direction:column;gap:11px}
.stat-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
.stat-nm{font-size:11px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px}
.stat-val{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:var(--text)}
.stat-bar{height:4px;background:var(--card3);border-radius:2px;overflow:hidden}
.stat-fill{height:100%;border-radius:2px;transition:width 0.5s ease}
.fill-gym{background:linear-gradient(90deg,var(--rose),var(--rose2))}
.fill-mob{background:linear-gradient(90deg,var(--sage),var(--sage2))}
.stat-fill.full{background:linear-gradient(90deg,var(--green),#79c39a)}
.rest-row{display:flex;align-items:center;gap:15px}
.rest-ic{width:52px;height:52px;border-radius:14px;background:var(--card2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
.rest-ic .ic{width:26px;height:26px;stroke-width:1.5}
.rest-inf-t{font-size:13px;color:var(--text);font-weight:600;margin-bottom:3px}
.rest-inf-s{font-size:10px;color:var(--muted);line-height:1.6}


.week-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:10px 14px}
.week-nav-btn{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted);cursor:pointer;width:30px;height:30px;display:flex;align-items:center;justify-content:center;transition:all 0.2s}
.week-nav-btn:hover{color:var(--rose);border-color:rgba(212,119,138,0.4)}
.week-nav-center{text-align:center;flex:1}
.week-nav-label{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:var(--text);letter-spacing:0.5px}
.week-nav-today{font-size:9px;font-weight:700;color:var(--rose);cursor:pointer;padding:3px 9px;border:1px solid rgba(212,119,138,0.3);border-radius:10px;background:var(--rose-dim);margin-top:4px;display:inline-block}
.week-label{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px}
.res-day-card{background:var(--card);border-radius:12px;margin-bottom:8px;border:1px solid var(--border);overflow:hidden;transition:border-color 0.2s}
.res-day-card.r-open{border-color:var(--border2)}
.res-day-card.is-today-card{border-color:rgba(127,156,123,0.3)}
.res-day-hdr{padding:13px 15px;display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.res-day-num{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:900;line-height:1;min-width:34px;color:var(--muted)}
.res-day-num.is-today{color:var(--sage)}
.res-day-info{flex:1;min-width:0}
.res-day-name{font-size:13px;font-weight:600;margin-bottom:1px;color:var(--text)}
.res-day-sub{font-size:10px;color:var(--muted)}
.res-day-pct{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:900;flex-shrink:0}
.res-day-chev{color:var(--muted);transition:transform 0.3s;flex-shrink:0;display:flex}
.res-day-card.r-open .res-day-chev{transform:rotate(180deg)}
.res-day-body{max-height:0;overflow:hidden;transition:max-height 0.35s ease}
.res-day-card.r-open .res-day-body{max-height:600px}
.res-act-list{padding:4px 15px 13px;border-top:1px solid var(--border)}
.res-act{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--border);font-size:11px}
.res-act:last-child{border-bottom:none}
.res-act-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-mob{background:var(--sage)}
.dot-gym{background:var(--rose)}
.dot-run{background:var(--ochre)}
.dot-rest{background:var(--muted2)}
.res-act-name{flex:1;color:var(--muted);display:flex;align-items:center;gap:6px}
.res-act-ok{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--green);display:flex;align-items:center;gap:4px}
.res-act-pend{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--muted2)}

/* TIMER */
.timer-ov{display:none;position:fixed;inset:0;background:rgba(250,246,240,0.97);z-index:200;align-items:center;justify-content:center;flex-direction:column}
.timer-ov.show{display:flex}
.t-ring{width:190px;height:190px;position:relative;margin-bottom:18px}
.t-ring svg{transform:rotate(-90deg)}
.t-ring circle.bg{fill:none;stroke:var(--card3);stroke-width:5}
.t-ring circle.prog{fill:none;stroke:var(--rose);stroke-width:5;stroke-linecap:round;transition:stroke-dashoffset 0.9s linear}
.t-inner{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.t-disp{font-family:'Barlow Condensed',sans-serif;font-size:50px;font-weight:900;color:var(--text);letter-spacing:-1px}
.t-lbl{font-size:11px;color:var(--muted);text-align:center;padding:0 32px;margin-bottom:28px;line-height:1.5}
.t-ctrl{display:flex;gap:10px}
.t-btn{padding:13px 28px;border-radius:11px;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;border:none;cursor:pointer;transition:opacity 0.2s}
.t-btn.pri{background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff}
.t-btn.sec{background:var(--card);color:var(--muted);border:1px solid var(--border2)}
.t-btn:active{opacity:0.8}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(250,246,240,0.97);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);padding:10px 6px 26px;display:flex;justify-content:space-around;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:none;cursor:pointer;color:var(--muted2);transition:color 0.2s;padding:5px 14px;border-radius:9px}
.nav-btn.active{color:var(--rose)}
.nav-btn .ni{font-size:20px;line-height:1;display:flex}
.nav-btn .nl{font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;font-family:'Barlow Condensed',sans-serif}
.view{display:none}.view.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

/* MODALES */
.edit-ov{display:none;position:fixed;inset:0;background:rgba(80,60,45,0.35);z-index:300;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.edit-ov.show{display:flex}
.edit-modal{background:var(--card);border:1px solid var(--border2);border-radius:18px 18px 0 0;padding:22px 20px 36px;width:100%;max-width:480px;max-height:92vh;overflow-y:auto;animation:slideUp 0.28s cubic-bezier(0.34,1.1,0.64,1) both}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.edit-modal-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.edit-modal-title{font-family:'Barlow Condensed',sans-serif;font-size:18px;font-weight:700;letter-spacing:0.5px;color:var(--text)}
.edit-close{background:var(--card2);border:1px solid var(--border2);color:var(--muted);width:28px;height:28px;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.edit-close .ic{width:13px;height:13px;stroke-width:2.2}
.edit-field{margin-bottom:14px}
.edit-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.edit-hint{font-size:9px;color:var(--muted2);margin:-6px 0 14px;line-height:1.5}
.icon-grid{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:9px}
.icon-opt{width:42px;height:42px;border-radius:11px;border:1px solid var(--border2);background:var(--card2);color:var(--muted);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all 0.15s;font-size:20px;line-height:1;padding:0}
.icon-opt .ic{width:20px;height:20px}
.icon-opt.sel{border-color:rgba(212,119,138,0.5);color:var(--rose);background:var(--rose-dim)}
.edit-lbl{display:block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:var(--muted);margin-bottom:6px}
.edit-inp,.edit-sel{width:100%;background:var(--card2);border:1px solid var(--border2);border-radius:9px;padding:11px 13px;font-size:13px;color:var(--text);font-family:'DM Sans',sans-serif;outline:none;transition:border-color 0.2s}
.edit-sel{-webkit-appearance:none;appearance:none}
.edit-inp:focus,.edit-sel:focus{border-color:rgba(212,119,138,0.45)}
.edit-actions{display:flex;gap:10px;margin-top:20px}
.edit-btn-cancel{flex:1;padding:13px;border-radius:10px;border:1px solid var(--border2);background:var(--card2);color:var(--muted);font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;letter-spacing:1px;cursor:pointer}
.edit-btn-save{flex:2;padding:13px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--rose),var(--rose2));color:#fff;font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:900;letter-spacing:1px;cursor:pointer}
.edit-btn-del{padding:13px 15px;border-radius:10px;border:1px solid rgba(194,96,122,0.35);background:rgba(194,96,122,0.08);color:#c2607a;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.edit-btn-del .ic{width:16px;height:16px}
.edit-reset{width:100%;margin-top:14px;padding:11px;border-radius:9px;border:1px solid var(--border2);background:transparent;color:var(--muted);font-family:'DM Sans',sans-serif;font-size:10px;font-weight:600;cursor:pointer}
.edit-reset:hover{color:#c2607a;border-color:rgba(194,96,122,0.35)}
</style>
</head>
<body>

<div class="timer-ov" id="timerOv">
  <div class="t-ring">
    <svg viewBox="0 0 190 190" width="190" height="190">
      <circle class="bg" cx="95" cy="95" r="87"/>
      <circle class="prog" id="tCircle" cx="95" cy="95" r="87" stroke-dasharray="547" stroke-dashoffset="0"/>
    </svg>
    <div class="t-inner"><div class="t-disp" id="tDisp">1:00</div></div>
  </div>
  <div class="t-lbl" id="tLbl">—</div>
  <div class="t-ctrl">
    <button class="t-btn pri" id="tToggle" onclick="toggleTimer()">INICIAR</button>
    <button class="t-btn sec" onclick="closeTimer()">CERRAR</button>
  </div>
</div>

<div class="header">
  <div class="header-top">
    <div class="app-id">
      <img class="app-logo" src="assets/logo-192.png" alt="Rutina Integral Guadalupe Ruiz">
      <div class="app-title">
        <div class="app-title-main">RUTINA INTEGRAL</div>
        <div class="app-title-sub">Guadalupe Ruiz</div>
      </div>
    </div>
    <div class="today-date" id="todayDate"></div>
  </div>
  <div class="week-strip-nav">
    <button class="week-strip-btn" onclick="changeMainWeek(-1)" aria-label="Semana anterior"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M14.4 5.6L8 12l6.4 6.4"/></svg></button>
    <div class="week-strip-label" id="weekStripLabel"></div>
    <button class="week-strip-btn" onclick="changeMainWeek(1)" aria-label="Semana siguiente"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9.6 5.6L16 12l-6.4 6.4"/></svg></button>
  </div>
  <div class="day-strip" id="daySelector"></div>
</div>

<div class="content">
  <div class="view active" id="view-gym">
    <div class="day-hero">
      <div class="lbl-row">
        <div class="day-lbl" id="dayLbl">—</div>
        <button class="lbl-edit" id="dayLblEdit" onclick="openDayName()" title="Renombrar actividad del día"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 19.7h4L19.2 8.8a2.5 2.5 0 0 0-3.5-3.5L4.3 15.7v4z"/><path d="M14.6 6.5l3.4 3.4"/></svg></button>
      </div>
      <div class="day-big" id="dayBig">LUNES</div>
      <div class="day-sub" id="daySub">—</div>
    </div>
    <div class="mode-row">
      <button class="mode-btn" id="modeBtn" onclick="toggleEditMode()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 19.7h4L19.2 8.8a2.5 2.5 0 0 0-3.5-3.5L4.3 15.7v4z"/><path d="M14.6 6.5l3.4 3.4"/></svg><span id="modeTxt">Editar rutina</span></button>
      <div class="mode-hint" id="modeHint"></div>
    </div>
    <div id="gymContent"></div>
  </div>
  <div class="view" id="view-postura"><div id="postContent"></div></div>
  <div class="view" id="view-resumen"><div id="resContent"></div></div>
</div>

<!-- Modal: editar / agregar ejercicio -->
<div class="edit-ov" id="editOv" onclick="closeEditIfBg(event)">
  <div class="edit-modal">
    <div class="edit-modal-hdr">
      <div class="edit-modal-title" id="editTitle">Editar ejercicio</div>
      <button class="edit-close" onclick="closeEdit()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg></button>
    </div>
    <div class="edit-field">
      <label class="edit-lbl">Nombre</label>
      <input class="edit-inp" id="editName" type="text" placeholder="Nombre del ejercicio"/>
    </div>
    <div class="edit-grid">
      <div class="edit-field">
        <label class="edit-lbl">Series</label>
        <input class="edit-inp" id="editSets" type="text" inputmode="decimal" placeholder="4"/>
      </div>
      <div class="edit-field">
        <label class="edit-lbl">Reps</label>
        <input class="edit-inp" id="editReps" type="text" placeholder="8-12 reps"/>
      </div>
      <div class="edit-field">
        <label class="edit-lbl">Peso</label>
        <input class="edit-inp" id="editWeight" type="text" placeholder="20 kg"/>
      </div>
    </div>
    <div class="edit-hint">Dejá vacío lo que no aplique — no se muestra en la rutina.</div>
    <div class="edit-field">
      <label class="edit-lbl">Categoría</label>
      <select class="edit-sel" id="editTag">
        <option value="fuerza">Fuerza</option>
        <option value="volumen">Volumen</option>
        <option value="core">Core</option>
        <option value="postura">Postura</option>
        <option value="correctivo">Correctivo</option>
        <option value="atletico">Atlético</option>
        <option value="cardio">Cardio</option>
        <option value="">Sin categoría</option>
      </select>
    </div>
    <div class="edit-field">
      <label class="edit-lbl">Nota <span style="color:var(--muted2);font-weight:400">(opcional)</span></label>
      <input class="edit-inp" id="editNote" type="text" placeholder="Tip o clave del ejercicio"/>
    </div>
    <div class="edit-actions">
      <button class="edit-btn-del" id="editDel" onclick="deleteEx()" title="Eliminar ejercicio"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.3 6.9h15.4M9.7 6.9V4.7h4.6v2.2M6.7 6.9l.9 13.1h8.8l.9-13.1M10.5 10.9v5.3M13.5 10.9v5.3"/></svg></button>
      <button class="edit-btn-cancel" onclick="closeEdit()">Cancelar</button>
      <button class="edit-btn-save" onclick="saveEdit()">Guardar</button>
    </div>
  </div>
</div>

<!-- Modal: renombrar día o bloque -->
<div class="edit-ov" id="nameOv" onclick="closeNameIfBg(event)">
  <div class="edit-modal">
    <div class="edit-modal-hdr">
      <div class="edit-modal-title" id="nameTitle">Renombrar</div>
      <button class="edit-close" onclick="closeName()"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/></svg></button>
    </div>
    <div class="edit-field">
      <label class="edit-lbl" id="nameLbl">Nombre</label>
      <input class="edit-inp" id="nameInp" type="text" placeholder="ej: Glúteos y Femorales"/>
    </div>
    <div class="edit-field" id="nameSubWrap">
      <label class="edit-lbl" id="nameSubLbl">Subtítulo</label>
      <input class="edit-inp" id="nameSub" type="text" placeholder="ej: Bloque 1 · Fuerza"/>
    </div>
    <div class="edit-field" id="nameIconWrap">
      <label class="edit-lbl">Ícono</label>
      <div class="icon-grid" id="iconGrid"></div>
      <input class="edit-inp" id="nameEmoji" type="text" maxlength="8" placeholder="o poné un emoji: 🏑 🌿 🔥" oninput="onEmojiInput()"/>
      <div class="edit-hint" style="margin:7px 0 0">Elegí uno de los íconos o escribí un emoji con el teclado.</div>
    </div>
    <div class="edit-actions">
      <button class="edit-btn-cancel" onclick="closeName()">Cancelar</button>
      <button class="edit-btn-save" onclick="saveName()">Guardar</button>
    </div>
    <button class="edit-reset" id="nameReset" onclick="resetDay()">Restaurar rutina original de este día</button>
  </div>
</div>

<div class="bottom-nav">
  <button class="nav-btn active" onclick="sw('gym')" id="nav-gym"><span class="ni"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 8.5v7M3.6 10.5v3M17.5 8.5v7M20.4 10.5v3M6.5 12h11"/></svg></span><span class="nl">Gym</span></button>
  <button class="nav-btn" onclick="sw('postura')" id="nav-postura"><span class="ni"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="4.4" r="2.05"/><path d="M12 6.9v7.3M8.4 9.9h7.2M12 14.2l-2.7 5.5M12 14.2l2.7 5.5"/></svg></span><span class="nl">Postura</span></button>
  <button class="nav-btn" onclick="sw('resumen')" id="nav-resumen"><span class="ni"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19.6h16"/><path d="M7.7 19.6v-5.3M12 19.6v-9.5M16.3 19.6v-3.3"/></svg></span><span class="nl">Resumen</span></button>
</div>

<script>
// ── ICONOS ── set propio en SVG, mismo trazo que el logo
const ICONS = {
  dumbbell:'<path d="M6.5 8.5v7M3.6 10.5v3M17.5 8.5v7M20.4 10.5v3M6.5 12h11"/>',
  bolt:'<path d="M13.2 2.8L6 12.6h4.8l-1 8.6L17 11.4h-4.8l1-8.6z"/>',

  core:'<path d="M7.2 3.9h9.6M7.2 20.1h9.6"/><path d="M9.4 3.9c0 4.1-3 4.1-3 8.1s3 4 3 8.1M14.6 3.9c0 4.1 3 4.1 3 8.1s-3 4-3 8.1"/>',
  hockey:'<path d="M18.9 3.6L8.4 17.2"/><path d="M8.4 17.2c-1.3 1.7-3.2 2.2-4.5 1.2-1.2-.9-1.1-2.5.2-3.3"/><circle cx="18.6" cy="18.4" r="1.9"/>',
  posture:'<circle cx="12" cy="4.4" r="2.05"/><path d="M12 6.9v7.3M8.4 9.9h7.2M12 14.2l-2.7 5.5M12 14.2l2.7 5.5"/>',
  chart:'<path d="M4 19.6h16"/><path d="M7.7 19.6v-5.3M12 19.6v-9.5M16.3 19.6v-3.3"/>',
  moon:'<path d="M20.2 14.9A8.6 8.6 0 0 1 9.1 3.8a8.6 8.6 0 1 0 11.1 11.1z"/>',
  timer:'<circle cx="12" cy="13.9" r="7.3"/><path d="M12 10.1v3.8l2.5 1.5"/><path d="M9.6 2.7h4.8M12 2.7v3"/>',
  calendar:'<rect x="3.7" y="5.3" width="16.6" height="15" rx="2.6"/><path d="M3.7 10.1h16.6M8.3 3.3v4M15.7 3.3v4"/>',
  chevron:'<path d="M6.6 9.6l5.4 5.4 5.4-5.4"/>',
  check:'<path d="M5.2 12.6l4.5 4.5 9.1-9.4"/>',
  plus:'<path d="M12 5.6v12.8M5.6 12h12.8"/>',
  trash:'<path d="M4.3 6.9h15.4M9.7 6.9V4.7h4.6v2.2M6.7 6.9l.9 13.1h8.8l.9-13.1M10.5 10.9v5.3M13.5 10.9v5.3"/>',
  pencil:'<path d="M4.3 19.7h4L19.2 8.8a2.5 2.5 0 0 0-3.5-3.5L4.3 15.7v4z"/><path d="M14.6 6.5l3.4 3.4"/>',
  close:'<path d="M6.3 6.3l11.4 11.4M17.7 6.3L6.3 17.7"/>',
  arrowL:'<path d="M14.4 5.6L8 12l6.4 6.4"/>',
  arrowR:'<path d="M9.6 5.6L16 12l-6.4 6.4"/>',
  up:'<path d="M12 19V5.4M6.4 11L12 5.4 17.6 11"/>',
  down:'<path d="M12 5v13.6M17.6 13L12 18.6 6.4 13"/>'

function dateStr(dt) {
  const y = dt.getFullYear();
  const m = String(dt.getMonth()+1).padStart(2,'0');
  const d2 = String(dt.getDate()).padStart(2,'0');
  return `${y}-${m}-${d2}`;
}
function getToday(){ return new Date(); }
function getMondayOf(dt) {
  const d = new Date(dt);
  const dow = d.getDay();
  const diff = dow === 0 ? -6 : 1 - dow;
  d.setDate(d.getDate() + diff);
  d.setHours(0,0,0,0);
  return d;
}
function weekDays(mondayDt) {
  return Array.from({length:7}, (_,i) => {
    const d = new Date(mondayDt);
    d.setDate(mondayDt.getDate() + i);
    return d;
  });
}
function gymKey(dt, name){ return dateStr(dt) + '_gym_' + name; }
function postKey(dt, id){ return dateStr(dt) + '_post_' + id; }
function mobKey(dt){ return dateStr(dt) + '_mob'; }

let curDayDate = (function(){
  const t = getToday();
  t.setHours(0,0,0,0);
  return t;
})();
let resWeekOffset = 0;

// ── Porcentajes ──
function gymPct(dt) {
  const data = GYM[dt.getDay()];
  if(!data) return 0;
  const all = data.sessions.flatMap(s=>s.ex);
  return all.length ? Math.round(all.filter(e=>store[gymKey(dt,e.n)]).length/all.length*100) : 0;
}
function postPct(dt) {
  const sk = postSessKey(dt.getDay());
  if(!sk) return 0;
  const all = POST[sk].phases.flatMap(p=>p.ex);
  return all.length ? Math.round(all.filter(e=>store[postKey(dt,e.id)]).length/all.length*100) : 0;
}
function mobDone(dt){ return !!store[mobKey(dt)]; }
function totalPct(dt) {
  const gp = gymPct(dt);
  const pp = postPct(dt);
  if(!GYM[dt.getDay()]) return pp;
  if(!postSessKey(dt.getDay())) return gp;
  return Math.round((gp+pp)/2);
}

// ── Init ──
function init() {
  loadRoutine();
  applyEditMode();
  const today = getToday();
  document.getElementById('todayDate').textContent = today.toLocaleDateString('es-ES',{weekday:'short',day:'numeric',month:'short'});
  buildDays();
  renderDay(curDayDate);
}

function buildDays() {
  const cont = document.getElementById('daySelector');
  cont.innerHTML = '';
  const today = getToday();
  today.setHours(0,0,0,0);
  const todayStr = dateStr(today);
  const weekStart = getMondayOf(curDayDate);
  const weekEnd = new Date(weekStart); weekEnd.setDate(weekStart.getDate()+6);

  const lbl = document.getElementById('weekStripLabel');
  if(lbl) {
    const fmt = d => d.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
    const isCurrentWeek = dateStr(getMondayOf(today)) === dateStr(weekStart);
    lbl.innerHTML = fmt(weekStart) + ' — ' + fmt(weekEnd) + (isCurrentWeek ? '<span>Esta semana</span>' : '');
  }

  for(let i=0; i<7; i++) {
    const dt = new Date(weekStart);
    dt.setDate(weekStart.getDate() + i);
    const tp = totalPct(dt);
    const isActive = dateStr(dt) === dateStr(curDayDate);
    const isToday = dateStr(dt) === todayStr;
    const btn = document.createElement('div');
    let cls = 'day-btn';
    if(isActive) cls += ' active';
    if(tp > 0 && tp < 100) cls += ' has-dot';
    if(tp >= 100) cls += ' full-done';
    if(isToday) cls += ' today-mark';
    btn.className = cls;
    btn.dataset.date = dateStr(dt);
    btn.innerHTML = `<span class="dn">${DS[dt.getDay()]}</span><span class="dd">${dt.getDate()}</span><div class="day-dot"></div>`;
    btn.onclick = () => selDay(dt);
    cont.appendChild(btn);
  }
}

function changeMainWeek(delta) {
  const newDate = new Date(curDayDate);
  newDate.setDate(curDayDate.getDate() + delta * 7);
  curDayDate = newDate;
  buildDays();
  renderDay(curDayDate);
  if(document.getElementById('view-postura').classList.contains('active')) renderPostura(curDayDate);
  if(document.getElementById('view-resumen').classList.contains('active')) renderResumen();
}

function selDay(dt) {
  curDayDate = new Date(dt);
  openSess = new Set();
  buildDays();
  renderDay(curDayDate);
  if(document.getElementById('view-postura').classList.contains('active')) renderPostura(curDayDate);
  if(document.getElementById('view-resumen').classList.contains('active')) renderResumen();
}

// escapa texto que escribe la usuaria antes de insertarlo como HTML
function esc(t){
  return String(t==null?'':t).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

// arma "4 × 10 reps · 20 kg" omitiendo lo que esté vacío
function exMeta(ex){
  if(ex.sets||ex.reps||ex.weight){
    const parts=[];
    if(ex.sets&&ex.reps) parts.push(ex.sets+' × '+ex.reps);
    else if(ex.sets) parts.push(ex.sets+' series');
    else if(ex.reps) parts.push(ex.reps);
    if(ex.weight) parts.push(ex.weight);
    return parts.join(' · ');
  }
  return ex.m||'';
}

function renderDay(dt) {
  const d = dt.getDay();
  const data = GYM[d];
  document.getElementById('dayBig').textContent = DN[d];
  document.getElementById('dayLblEdit').style.display = data ? '' : 'none';
  const cont = document.getElementById('gymContent');
  if(!data) {
    document.getElementById('dayLbl').textContent = 'Descanso';
    document.getElementById('daySub').textContent = 'Recuperación activa';
    cont.innerHTML = `<div class="rest-card"><span class="rest-emoji">${icon('moon')}</span><div class="rest-title">DESCANSO TOTAL</div><div class="rest-txt">El músculo crece mientras descansás.<br>Hidratate · 8 horas de sueño · proteína.</div></div>`
      + `<button class="add-block" onclick="addBlock(${d})">${icon('plus')} Agregar bloque a este día</button>`;
    return;
  }
  document.getElementById('dayLbl').textContent = data.label;
  const nb = data.sessions.length;
  document.getElementById('daySub').textContent = `${nb} bloque${nb>1?'s':''}${data.tipo?' · '+data.tipo:''}`;
  renderSessions(dt, data);
}

// Bloques desplegados — se conserva al re-renderizar
let openSess = new Set();

// un bloque muestra su emoji si tiene, si no su ícono SVG
function sessGlyph(sess){
  return sess && sess.emoji ? `<span class="s-emoji">${esc(sess.emoji)}</span>`
                            : icon(sess && sess.icon || 'dumbbell');
}

function renderSessions(dt, data) {
  const cont = document.getElementById('gymContent');
  cont.innerHTML = '';
  const dow = dt.getDay();
  const dtStr = dateStr(dt);
  data.sessions.forEach((sess,si) => {
    const din = sess.ex.filter(e=>store[gymKey(dt,e.n)]).length;
    const pct = sess.ex.length ? Math.round(din/sess.ex.length*100) : 0;
    const ok = sess.ex.length>0 && din===sess.ex.length;
    const exHTML = sess.ex.map((ex,ei) => {
      const done = !!store[gymKey(dt,ex.n)];
      const meta = exMeta(ex);
      const tap = `onclick="toggleGymAt(${si},${ei},'${dtStr}')"`;
      return `<div class="ex-item${done?' done':''}">`
        + `<div class="ex-chk" ${tap}>${done?icon('check'):''}</div>`
        + `<div class="ex-det" ${tap}><div class="ex-nm">${esc(ex.n)}${ex.key?'<span class="ex-key">clave</span>':''}</div>`
        + `${meta?`<div class="ex-mt">${esc(meta)}</div>`:''}`
        + `${ex.note?`<div class="ex-nt">${esc(ex.note)}</div>`:''}</div>`
        + `${ex.t?`<span class="ex-tag tag-${esc(ex.t)}" ${tap}>${esc(TL[ex.t]||ex.t)}</span>`:''}`
        + `<span class="ex-tools">`
          + `<button class="ex-btn" onclick="moveEx(${dow},${si},${ei},-1,event)" ${ei===0?'disabled':''} title="Subir">${icon('up')}</button>`
          + `<button class="ex-btn" onclick="moveEx(${dow},${si},${ei},1,event)" ${ei===sess.ex.length-1?'disabled':''} title="Bajar">${icon('down')}</button>`
          + `<button class="ex-btn" onclick="openEdit(${dow},${si},${ei},event)" title="Editar">${icon('pencil')}</button>`
        + `</span></div>`;
    }).join('');
    const tools = `<div class="sess-tools">`
      + `<button class="tool-btn" onclick="moveSess(${dow},${si},-1,event)" ${si===0?'disabled':''}>${icon('up')} Subir bloque</button>`
      + `<button class="tool-btn" onclick="moveSess(${dow},${si},1,event)" ${si===data.sessions.length-1?'disabled':''}>${icon('down')} Bajar bloque</button>`
      + `<button class="tool-btn" onclick="openSessName(${dow},${si},event)">${icon('pencil')} Nombre e ícono</button>`
      + `<button class="tool-btn danger" onclick="deleteBlock(${dow},${si},event)">${icon('trash')} Eliminar bloque</button>`
      + `</div>`;
    const card = document.createElement('div');
    card.className = `session-card${openSess.has(si)?' open':''}${ok?' all-done':''}`;
    card.id = 'sc'+si;
    card.style.animationDelay = (si*0.06)+'s';
    card.innerHTML = `<div class="sess-hdr" onclick="togSess(${si})">`
      + `<div class="s-ico ${sess.ic||'ic-gym'}">${sessGlyph(sess)}</div>`
      + `<div class="s-inf"><div class="s-type">${esc(sess.type)}</div><div class="s-name">${esc(sess.name)}</div></div>`
      + `<span class="sess-edit" onclick="openSessName(${dow},${si},event)" title="Renombrar bloque e ícono">${icon('pencil')}</span>`
      + `<span class="s-badge${ok?' ok':''}">${ok?icon('check')+' Listo':din+'/'+sess.ex.length}</span>`
      + `<span class="chevron">${icon('chevron')}</span></div>`
      + `<div class="sess-body"><div class="pbar-wrap"><div class="pbar-lbl"><span>Progreso</span><span>${pct}%</span></div>`
      + `<div class="pbar"><div class="pbar-fill${ok?' gfill':''}" style="width:${pct}%"></div></div></div>`
      + tools
      + `<div class="ex-list">${exHTML}<button class="add-ex" onclick="addEx(${dow},${si},event)">${icon('plus')} Agregar ejercicio</button></div></div>`;
    cont.appendChild(card);
  });
  const addB = document.createElement('button');
  addB.className = 'add-block';
  addB.innerHTML = `${icon('plus')} Agregar bloque`;
  addB.onclick = () => addBlock(dow);
  cont.appendChild(addB);
}

function togSess(i){
  if(openSess.has(i)) openSess.delete(i); else openSess.add(i);
  document.getElementById('sc'+i).classList.toggle('open');
}

function toggleGymAt(si, ei, dtStr) {
  const [y,m,d2] = dtStr.split('-').map(Number);
  const dt = new Date(y,m-1,d2);
  const data = GYM[dt.getDay()];
  const ex = data && data.sessions[si] && data.sessions[si].ex[ei];
  if(!ex) return;
  const k = gymKey(dt, ex.n);
  store[k] = !store[k];
  saveStore();
  renderSessions(dt, data);
  buildDays();
}

// ── POSTURA ──
let openPost = new Set();

function renderPostura(dt) {
  const sk = postSessKey(dt.getDay());
  const cont = document.getElementById('postContent');
  cont.innerHTML = '';
  if(!sk) {
    cont.innerHTML = `<div class="rest-card"><span class="rest-emoji">${icon('moon')}</span><div class="rest-title">SIN SESIÓN</div><div class="rest-txt">Recuperación activa recomendada.</div></div>`;
    return;
  }
  const sess = POST[sk];
  const dtStr = dateStr(dt);
  const hero = document.createElement('div');
  hero.className = 'post-hero';
  hero.innerHTML = `<div class="post-badge"><div class="pb-dot"></div><div class="pb-txt">SESIÓN ${sk}</div></div><div class="post-title">${sess.title}</div><div class="post-desc">${sess.desc}</div>`;
  cont.appendChild(hero);
  const pills = document.createElement('div');
  pills.className = 'phase-pills';
  sess.phases.forEach(ph => {
    const done = ph.ex.every(e=>store[postKey(dt,e.id)]);
    pills.innerHTML += `<div class="ph-pill${done?' done-ph':''}">${done?icon('check')+' ':''}${ph.name}</div>`;
  });
  cont.appendChild(pills);
  sess.phases.forEach(ph => {
    const bt = document.createElement('div');
    bt.className = 'ph-block-title';
    bt.textContent = `${ph.name} — ${ph.sub}`;

    ph.ex.forEach((ex,ei) => {
      const ok = !!store[postKey(dt,ex.id)];
      const card = document.createElement('div');
      card.className = `p-card${ok?' p-done':''}${openPost.has(ex.id)?' p-open':''}`;
      card.id = 'pe'+ex.id;
      card.style.animationDelay = (ei*0.04)+'s';
      const steps = ex.steps.map((s,i)=>`<li><span class="p-sn">${i+1}</span>${s}</li>`).join('');
      const safeN = ex.name.replace(/'/g,"\\'");
      const tb = ex.timer ? `<button class="tbtn" onclick="openTimer(${ex.timer},'${safeN}')">${icon('timer')} ${ex.timer}s</button>` : '';
      card.innerHTML = `<div class="p-hdr"><div class="p-chk" onclick="togglePost('${ex.id}','${dtStr}',event)">${ok?icon('check'):''}</div><div class="p-inf" onclick="togP('${ex.id}')"><div class="p-nm">${ex.name}</div><div class="p-pm">${ex.params}</div></div><span class="p-chev" onclick="togP('${ex.id}')">${icon('chevron')}</span></div><div class="p-body"><div class="p-detail"><div class="p-why"><strong>¿Por qué?</strong> ${ex.why}</div><ul class="p-steps">${steps}</ul><div class="p-btns">${tb}<button class="dbtn${ok?' is-done':''}" onclick="togglePost('${ex.id}','${dtStr}',event)">${ok?icon('check')+' Hecho':'Marcar hecho'}</button></div></div></div>`;
      cont.appendChild(card);
    });
  });
}

function togP(id){
  if(openPost.has(id)) openPost.delete(id); else openPost.add(id);
  document.getElementById('pe'+id).classList.toggle('p-open');
}

function togglePost(id, dtStr, ev) {
  if(ev) ev.stopPropagation();
  const [y,m,d2] = dtStr.split('-').map(Number);
  const dt = new Date(y,m-1,d2);
  const k = postKey(dt, id);
  store[k] = !store[k];
  saveStore();
  renderPostura(dt);
  buildDays();
}

// ── RESUMEN ──
function renderResumen() {
  const cont = document.getElementById('resContent');
  cont.innerHTML = '';

  const today = getToday();
  today.setHours(0,0,0,0);
  const todayStr = dateStr(today);

  const baseMon = getMondayOf(today);
  const weekMon = new Date(baseMon);
  weekMon.setDate(baseMon.getDate() + resWeekOffset * 7);
  const days = weekDays(weekMon);
  const weekSun = days[6];

  const fmt = (dt) => dt.toLocaleDateString('es-ES',{day:'numeric',month:'short'});
  const weekRange = `${fmt(weekMon)} – ${fmt(weekSun)}`;
  const isCurrentWeek = resWeekOffset === 0;

  cont.innerHTML = `<div class="res-header"><div class="res-title">RESUMEN SEMANAL</div><div class="res-sub">Vista general · progreso y actividades</div></div>`;

  const sd = curDayDate;
  const sdStr = dateStr(sd);
  const gp = gymPct(sd), pp = postPct(sd), tp = totalPct(sd);
  const tb = document.createElement('div');
  tb.className = 'today-box';
  const isRestDay = !GYM[sd.getDay()] && !postSessKey(sd.getDay());
  const dayLabel = sdStr === todayStr ? 'HOY · ' : '';
  const hdr = `<div class="today-box-lbl">${icon('calendar')} ${dayLabel}${DN[sd.getDay()]}</div>`;

  if(isRestDay) {
    tb.innerHTML = hdr + `<div class="rest-row"><div class="rest-ic">${icon('moon')}</div><div><div class="rest-inf-t">Día de descanso</div><div class="rest-inf-s">Recuperación activa · hidratate bien</div></div></div>`;
  } else {
    const C = 2 * Math.PI * 34;
    const off = C * (1 - Math.min(tp,100)/100);
    const hasGym = !!GYM[sd.getDay()];
    const hasMob = !!postSessKey(sd.getDay());
    const bar = (nm, ico, val, cls, show) => show
      ? `<div><div class="stat-top"><span class="stat-nm">${icon(ico)} ${nm}</span><span class="stat-val">${val}%</span></div><div class="stat-bar"><div class="stat-fill ${val>=100?'full':cls}" style="width:${val}%"></div></div></div>`
      : `<div><div class="stat-top"><span class="stat-nm">${icon(ico)} ${nm}</span><span class="stat-val" style="color:var(--muted2);font-size:11px">—</span></div><div class="stat-bar"></div></div>`;
    tb.innerHTML = hdr + `<div class="today-row">
      <div class="ring${tp>=100?' done':''}">
        <svg viewBox="0 0 80 80"><circle class="r-bg" cx="40" cy="40" r="34"/><circle class="r-fg" cx="40" cy="40" r="34" stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"/></svg>
        <div class="ring-txt">${tp}<span>%</span></div>
      </div>
      <div class="today-stats">
        ${bar('Gym','dumbbell',gp,'fill-gym',hasGym)}
        ${bar('Movilidad','posture',pp,'fill-mob',hasMob)}
      </div>
    </div>`;
  }
  cont.appendChild(tb);

  const nav = document.createElement('div');
  nav.className = 'week-nav';
  nav.innerHTML = `
    <button class="week-nav-btn" onclick="changeWeek(-1)">${icon('arrowL')}</button>
    <div class="week-nav-center">
      <div class="week-nav-label">${weekRange}</div>
      ${!isCurrentWeek ? `<div><span class="week-nav-today" onclick="changeWeek(0)">IR A HOY</span></div>` : '<div style="font-size:9px;color:var(--rose);margin-top:3px;font-weight:700">SEMANA ACTUAL</div>'}
    </div>
    <button class="week-nav-btn" onclick="changeWeek(1)">${icon('arrowR')}</button>
  `;
  cont.appendChild(nav);

  const wl = document.createElement('div');
  wl.className = 'week-label';
  wl.textContent = 'ACTIVIDADES POR DÍA';
  cont.appendChild(wl);

  days.forEach((dt, i) => {
    const d = dt.getDay();
    const dtStr2 = dateStr(dt);
    const isFuture = dt > today;
    const isToday2 = dtStr2 === todayStr;
    const isCurDay = dtStr2 === sdStr;
    const data = GYM[d];
    const tp2 = isFuture ? 0 : totalPct(dt);
    const sk = postSessKey(d);
    const pctColor = tp2>=100?'var(--green)':tp2>0?'var(--rose)':'var(--muted)';

    let acts = [];
    if(sk) acts.push({type:'mob',name:`${icon('posture')} Movilidad Sesión ${sk} — ${POST[sk].title}`,done:!isFuture&&postPct(dt)>=100});
    if(data) {
      data.sessions.forEach(sess => {
        const dn = isFuture ? 0 : sess.ex.filter(e=>store[gymKey(dt,e.n)]).length;
        acts.push({type:sess.ic==='ic-gym'?'gym':'run',name:`${sessGlyph(sess)} ${esc(sess.name)}${isFuture?'':' ('+dn+'/'+sess.ex.length+')'}`,done:!isFuture&&sess.ex.length>0&&dn===sess.ex.length});
      });
    } else {
      acts.push({type:'rest',name:icon('moon')+' Descanso total',done:true});
    }

    const actsHTML = acts.map(a=>`<div class="res-act"><div class="res-act-dot dot-${a.type}"></div><div class="res-act-name">${a.name}</div><div class="${a.done?'res-act-ok':'res-act-pend'}">${isFuture&&a.type!=='rest'?'—':a.done?icon('check')+' hecho':'pendiente'}</div></div>`).join('');

    const card = document.createElement('div');
    let cardCls = 'res-day-card';
    if(isCurDay) cardCls += ' r-open';
    if(isToday2) cardCls += ' is-today-card';
    card.className = cardCls;
    card.id = 'rdd'+i;

    const todayBadge = isToday2 ? ' · <span style="color:var(--sage);font-size:9px;font-weight:700">HOY</span>' : '';
    card.innerHTML = `<div class="res-day-hdr" onclick="togR('rdd${i}')">
      <div class="res-day-num${isToday2?' is-today':''}">${dt.getDate()}</div>
      <div class="res-day-info">
        <div class="res-day-name">${DS[d]}${todayBadge}</div>
        <div class="res-day-sub">${data?esc(data.label):'Descanso'}${isFuture?' · <span style="color:var(--muted2);font-size:9px">pendiente</span>':''}</div>
      </div>
      <div class="res-day-pct" style="color:${isFuture?'var(--muted2)':pctColor}">${isFuture?'—':tp2>0?tp2+'%':data?'—':icon('moon')}</div>
      <span class="res-day-chev">${icon('chevron')}</span>
    </div>
    <div class="res-day-body"><div class="res-act-list">${actsHTML}</div></div>`;
    cont.appendChild(card);
  });
}

function changeWeek(delta) {
  if(delta === 0) resWeekOffset = 0;
  else resWeekOffset += delta;
  renderResumen();
}

function togR(id){ document.getElementById(id).classList.toggle('r-open') }

// ── TIMER ──
let timerInterval=null,timerSecs=0,timerTotal=0,timerRunning=false;
function openTimer(s,l){
  timerSecs=s;timerTotal=s;timerRunning=false;clearInterval(timerInterval);
  document.getElementById('tDisp').textContent=fmt(s);
  document.getElementById('tLbl').textContent=l;
  document.getElementById('tToggle').textContent='INICIAR';
  updateRing(s,s);
  document.getElementById('timerOv').classList.add('show');
}
function updateRing(rem,total){
  const c=document.getElementById('tCircle');
  const circ=2*Math.PI*87;
  c.style.strokeDasharray=circ;
  c.style.strokeDashoffset=total>0?circ*(1-rem/total):0;
}
function toggleTimer(){
  if(timerRunning){clearInterval(timerInterval);timerRunning=false;document.getElementById('tToggle').textContent='CONTINUAR';}
  else{timerRunning=true;document.getElementById('tToggle').textContent='PAUSAR';
    timerInterval=setInterval(()=>{timerSecs--;updateRing(Math.max(0,timerSecs),timerTotal);document.getElementById('tDisp').textContent=timerSecs>0?fmt(timerSecs):'¡LISTO!';if(timerSecs<=0){clearInterval(timerInterval);timerRunning=false;document.getElementById('tToggle').textContent='REINICIAR';}},1000);}
}
function closeTimer(){clearInterval(timerInterval);timerRunning=false;document.getElementById('timerOv').classList.remove('show')}
function fmt(s){const m=Math.floor(s/60);const sec=s%60;return m+':'+(sec<10?'0':'')+sec}

// ── NAV ──
function sw(v){
  if(v==='postura') renderPostura(curDayDate);
  if(v==='resumen') renderResumen();
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('nav-'+v).classList.add('active');
}

// ── RUTINA EDITABLE ──
// Se guarda la rutina completa por día de semana: al editar cualquier cosa de
// un día, ese día queda "propio" y ya no toma el default.
const ROUTINE_KEY = 'gr_routine_v1';

function saveRoutine(){
  const out = {};
  for(let d=0; d<7; d++) out[d] = GYM[d] || null;
  try { localStorage.setItem(ROUTINE_KEY, JSON.stringify(out)); } catch(e){}
}

function loadRoutine(){
  let saved = {};
  try { saved = JSON.parse(localStorage.getItem(ROUTINE_KEY) || '{}'); } catch(e){ saved = {}; }
  Object.keys(saved).forEach(dow => {
    if(saved[dow] === undefined) return;
    GYM[dow] = saved[dow];
  });
}

function refreshGym(){
  renderDay(curDayDate);
  buildDays();
}

// ── MODO EDICIÓN ──
let editMode = false;
try { editMode = localStorage.getItem('gr_edit_mode') === '1'; } catch(e){}

function applyEditMode(){
  document.body.classList.toggle('edit-on', editMode);
  document.getElementById('modeBtn').classList.toggle('on', editMode);
  document.getElementById('modeTxt').textContent = editMode ? 'Listo' : 'Editar rutina';
  document.getElementById('modeHint').textContent = editMode
    ? 'Reordená, editá, agregá o eliminá ejercicios y bloques'
    : '';
}

function toggleEditMode(){
  editMode = !editMode;
  try { localStorage.setItem('gr_edit_mode', editMode?'1':'0'); } catch(e){}
  applyEditMode();
}

// ── MODAL: editar / agregar ejercicio ──
let editCtx = null;   // {dow, si, ei}  — ei === null significa "agregar"

function fillEdit(ex){
  document.getElementById('editName').value   = ex.n || '';
  document.getElementById('editSets').value   = ex.sets || '';
  document.getElementById('editReps').value   = ex.reps || '';
  document.getElementById('editWeight').value = ex.weight || '';
  document.getElementById('editNote').value   = ex.note || '';
  document.getElementById('editTag').value    = ex.t || '';
}

function openEdit(dow, si, ei, e){
  if(e) e.stopPropagation();
  const ex = GYM[dow] && GYM[dow].sessions[si] && GYM[dow].sessions[si].ex[ei];
  if(!ex) return;
  editCtx = {dow, si, ei};
  // si el ejercicio viene del formato original ("4 × 10 reps"), se muestra en Reps
  const seed = (ex.sets||ex.reps||ex.weight) ? ex : {...ex, reps: ex.m || ''};
  fillEdit(seed);
  document.getElementById('editTitle').textContent = 'Editar ejercicio';
  document.getElementById('editDel').style.display = 'flex';
  document.getElementById('editOv').classList.add('show');
}

function addEx(dow, si, e){
  if(e) e.stopPropagation();
  editCtx = {dow, si, ei: null};
  fillEdit({t:'fuerza'});
  document.getElementById('editTitle').textContent = 'Agregar ejercicio';
  document.getElementById('editDel').style.display = 'none';
  document.getElementById('editOv').classList.add('show');
  setTimeout(()=>document.getElementById('editName').focus(), 80);
}

function closeEdit(){
  document.getElementById('editOv').classList.remove('show');
  editCtx = null;
}
function closeEditIfBg(e){
  if(e.target === document.getElementById('editOv')) closeEdit();
}

function saveEdit(){
  if(!editCtx) return;
  const {dow, si, ei} = editCtx;
  const name = document.getElementById('editName').value.trim();
  if(!name){ document.getElementById('editName').focus(); return; }
  const data = {
    n: name,
    sets:   document.getElementById('editSets').value.trim(),
    reps:   document.getElementById('editReps').value.trim(),
    weight: document.getElementById('editWeight').value.trim(),
    note:   document.getElementById('editNote').value.trim(),
    t:      document.getElementById('editTag').value,
    m: ''   // se descarta el formato libre original al guardar
  };
  const list = GYM[dow].sessions[si].ex;
  if(ei === null) list.push(data);
  else Object.assign(list[ei], data);
  saveRoutine();
  closeEdit();
  refreshGym();
}

function deleteEx(){
  if(!editCtx || editCtx.ei === null) return;
  const {dow, si, ei} = editCtx;
  const ex = GYM[dow].sessions[si].ex[ei];
  if(!confirm('¿Eliminar "'+ex.n+'" de la rutina?')) return;
  GYM[dow].sessions[si].ex.splice(ei, 1);
  saveRoutine();
  closeEdit();
  refreshGym();
}

function moveEx(dow, si, ei, dir, e){
  if(e) e.stopPropagation();
  const list = GYM[dow].sessions[si].ex;
  const to = ei + dir;
  if(to < 0 || to >= list.length) return;
  const [item] = list.splice(ei, 1);
  list.splice(to, 0, item);
  saveRoutine();
  openSess.add(si);
  refreshGym();
}

// ── BLOQUES ──
function moveSess(dow, si, dir, e){
  if(e) e.stopPropagation();
  const list = GYM[dow].sessions;
  const to = si + dir;
  if(to < 0 || to >= list.length) return;
  const [item] = list.splice(si, 1);
  list.splice(to, 0, item);
  saveRoutine();
  openSess = new Set([to]);
  refreshGym();
}

function addBlock(dow){
  if(!GYM[dow]) GYM[dow] = {label:'Entrenamiento', tipo:'', sessions:[]};
  GYM[dow].sessions.push({
    id:'blk_'+Date.now(),
    type:'Bloque '+(GYM[dow].sessions.length+1),
    name:'Nuevo bloque',
    icon:'dumbbell', ic:'ic-gym',
    ex:[]
  });
  saveRoutine();
  openSess.add(GYM[dow].sessions.length-1);
  refreshGym();
}

function deleteBlock(dow, si, e){
  if(e) e.stopPropagation();
  const sess = GYM[dow].sessions[si];
  if(!confirm('¿Eliminar el bloque "'+sess.name+'" y todos sus ejercicios?')) return;
  GYM[dow].sessions.splice(si, 1);
  if(GYM[dow].sessions.length === 0) GYM[dow] = null;
  saveRoutine();
  openSess = new Set();
  refreshGym();
}

// ── MODAL: renombrar día o bloque ──
let nameCtx = null;   // {kind:'day'|'sess', dow, si}

// íconos disponibles para un bloque, además de cualquier emoji
const ICON_CHOICES = ['dumbbell','core','bolt','run','leaf','hockey','posture','timer','moon'];
let iconSel = null;   // nombre del ícono elegido, o null si se usa un emoji

function buildIconGrid(){
  const g = document.getElementById('iconGrid');
  g.innerHTML = ICON_CHOICES.map(n =>
    `<button type="button" class="icon-opt${n===iconSel?' sel':''}" data-ic="${n}" onclick="pickIcon('${n}')">${icon(n)}</button>`
  ).join('');
}

function pickIcon(n){
  iconSel = n;
  document.getElementById('nameEmoji').value = '';   // el ícono manda sobre el emoji
  buildIconGrid();
}

function onEmojiInput(){
  // si escribe un emoji, se deselecciona el ícono
  if(document.getElementById('nameEmoji').value.trim()){
    iconSel = null;
    buildIconGrid();
  }
}

function openNameModal(title, label, value, subLabel, subValue, showReset, sess){
  document.getElementById('nameTitle').textContent = title;
  document.getElementById('nameLbl').textContent = label;
  document.getElementById('nameInp').value = value || '';
  document.getElementById('nameSubLbl').textContent = subLabel;
  document.getElementById('nameSub').value = subValue || '';
  document.getElementById('nameReset').style.display = showReset ? 'block' : 'none';
  // el ícono solo aplica a bloques
  document.getElementById('nameIconWrap').style.display = sess ? '' : 'none';
  if(sess){
    document.getElementById('nameEmoji').value = sess.emoji || '';
    iconSel = sess.emoji ? null : (sess.icon || 'dumbbell');
    buildIconGrid();
  }
  document.getElementById('nameOv').classList.add('show');
  setTimeout(()=>document.getElementById('nameInp').focus(), 80);
}

function openDayName(){
  const dow = curDayDate.getDay();
  if(!GYM[dow]) return;
  nameCtx = {kind:'day', dow};
  openNameModal('Actividad del día', 'Nombre de la actividad', GYM[dow].label,
                'Descripción corta', GYM[dow].tipo, true, null);
}

function openSessName(dow, si, e){
  if(e) e.stopPropagation();
  const sess = GYM[dow].sessions[si];
  nameCtx = {kind:'sess', dow, si};
  openNameModal('Nombre del bloque', 'Nombre', sess.name, 'Subtítulo', sess.type, false, sess);
}

function closeName(){
  document.getElementById('nameOv').classList.remove('show');
  nameCtx = null;
}
function closeNameIfBg(e){
  if(e.target === document.getElementById('nameOv')) closeName();
}

function saveName(){
  if(!nameCtx) return;
  const v = document.getElementById('nameInp').value.trim();
  const sub = document.getElementById('nameSub').value.trim();
  if(!v){ document.getElementById('nameInp').focus(); return; }
  if(nameCtx.kind === 'day'){
    GYM[nameCtx.dow].label = v;
    GYM[nameCtx.dow].tipo = sub;
  } else {
    const sess = GYM[nameCtx.dow].sessions[nameCtx.si];
    sess.name = v;
    sess.type = sub;
    const emoji = document.getElementById('nameEmoji').value.trim();
    sess.emoji = emoji;                       // vacío = se usa el ícono
    if(!emoji) sess.icon = iconSel || sess.icon || 'dumbbell';
  }
  saveRoutine();
  closeName();
  refreshGym();
}

function resetDay(){
  if(!nameCtx || nameCtx.kind !== 'day') return;
  const dow = nameCtx.dow;
  if(!confirm('¿Restaurar la rutina original de este día? Se pierden los cambios que hiciste.')) return;
  GYM[dow] = GYM_DEFAULT[dow] ? JSON.parse(JSON.stringify(GYM_DEFAULT[dow])) : null;
  saveRoutine();
  openSess = new Set();
  closeName();
  refreshGym();
}

init();
</script>
</body>
